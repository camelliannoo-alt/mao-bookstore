<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết sách – Nhà sách Mão</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/detail.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container detail-page">

  <!-- Đường dẫn cho biết người đọc đang ở trang nào -->
  <nav class="detail-breadcrumb" aria-label="Đường dẫn">
    <a href="index.html">Trang chủ</a>
    <span aria-hidden="true">/</span>
    <a href="products.html">Sách</a>
    <span aria-hidden="true">/</span>
    <span id="breadcrumb-title" aria-current="page">Chi tiết sách</span>
  </nav>

  <section class="detail-error" aria-labelledby="detail-error-title" hidden>
    <h1 id="detail-error-title">Không tìm thấy sách</h1>
    <p id="detail-error-message">Hãy chọn một quyển từ danh mục sách.</p>
    <a class="btn" href="products.html">Về danh mục sách</a>
  </section>

  <!-- Phần thông tin đầu trang -->
  <section class="detail-top" aria-labelledby="book-title" hidden>

    <!-- Cột trái: ảnh bìa và hồ sơ -->
    <div class="detail-left">
      <div class="detail-cover-frame">
        <div id="book-cover"></div>
        <span id="book-ribbon" class="detail-ribbon" hidden></span>
      </div>

      <section class="detail-record">
        <h2>Hồ sơ bản in</h2>

        <dl>
          <div>
            <dt>Thể loại</dt>
            <dd id="book-category">Đang cập nhật</dd>
          </div>

          <div>
            <dt>Ấn hành đầu tiên</dt>
            <dd id="book-year">Đang cập nhật</dd>
          </div>

          <div>
            <dt>Nhà xuất bản</dt>
            <dd id="book-publisher">Đang cập nhật</dd>
          </div>
        </dl>

        <h3>Hiện trạng lưu trữ</h3>
        <p id="book-status">Đang cập nhật</p>
      </section>
    </div>

    <!-- Cột phải: tên, tác giả và giới thiệu -->
    <div class="detail-right">
      <div id="book-labels"></div>

      <h1 id="book-title"></h1>
      <p class="detail-author">Tác giả: <span id="book-author"></span></p>

      <blockquote class="detail-description">
        <p id="book-description"></p>
      </blockquote>

      <a id="back-to-products" class="btn" href="products.html">
        ← Quay lại danh mục sách
      </a>

      <p id="book-note" class="detail-note"></p>
    </div>

  </section>

    <article class="detail-review" aria-labelledby="review-title" hidden>
      <header class="review-header">
        <h2 id="review-title"></h2>
        <p id="review-credit"></p>
      </header>
      <div id="review-content"></div>
    </article>

    <section class="detail-related" aria-labelledby="related-title" hidden>
      <h2 id="related-title">Sách cùng thể loại</h2>
      <div id="related-books" class="detail-related-grid"></div>
    </section>

</main>

  <div id="site-footer"></div>

  <script src="js/layout.js"></script>
  <script type="module" src="js/detail.js"></script>
</body>
</html>
